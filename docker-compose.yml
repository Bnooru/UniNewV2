version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: uninew_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: uninew
      POSTGRES_USER: uninew
      POSTGRES_PASSWORD: uninew123
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U uninew -d uninew -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build: ./backend
    container_name: uninew_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://uninew:uninew123@db:5432/uninew
      JWT_SECRET: uninew_jwt_secret_academico
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    image: nginx:alpine
    container_name: uninew_web
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pg_data:
