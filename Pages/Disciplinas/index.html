<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>UniNew — Disciplinas</title>
  <link rel="stylesheet" href="../../Styles/global.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">

    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__logo" id="header-logo">UniNew</span>
        <span class="app-header__greeting" id="header-greeting">Olá, Administrador.</span>
      </div>
      <button class="btn-logout" id="btn-sair">Sair</button>
    </header>

    <main class="page-content">
      <div class="page-header-row">
        <h1 class="page-title" style="margin:0">Disciplinas</h1>
        <a class="back-link" href="../Admin/index.html">← Voltar</a>
      </div>

      <!-- Formulário -->
      <div class="card" id="form-card">
        <p class="section-title" id="form-title">Adicionar Disciplina</p>
        <div class="form-group">
          <label class="form-label" for="f-nome">Nome da Disciplina</label>
          <input class="form-input" id="f-nome" placeholder="Ex: Desenvolvimento Mobile II">
        </div>
        <div class="form-group">
          <label class="form-label" for="f-ch">Carga Horária (h)</label>
          <input class="form-input" id="f-ch" type="number" min="1" max="400" placeholder="60">
        </div>
        <div class="btn-row">
          <button class="btn btn--primary"   id="btn-salvar">SALVAR</button>
          <button class="btn btn--secondary" id="btn-cancelar">CANCELAR</button>
        </div>
      </div>

      <!-- Busca -->
      <div class="search-bar">
        <span class="search-bar__icon">🔍</span>
        <input class="search-bar__input" id="search-input" placeholder="Pesquisar disciplina…">
      </div>

      <!-- Lista -->
      <div class="card card--no-pad" id="list-card">
        <div id="disc-list">
          <div class="state-box"><div class="spinner"></div></div>
        </div>
      </div>

    </main>
  </div>

  <script src="../../Js/global.js"></script>
  <script src="script.js"></script>
</body>
</html>
